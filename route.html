<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Route Planner</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        #map {
            width:100%;
            height:600px;
            border:thin solid #CCC;
        }

        #control-panel {
            background-color: #fff;
            margin-bottom:50px;
        }

        .select-location-label {
            font-weight:bold;
            min-width:40px;
            display:inline-block;
        }

        #directions {
            width:100%;
            margin-top:20px;
            margin-bottom:50px;
        }
    </style>

    <nav>
        <ul class="sidebar">
            <li onclick=hideSidebar()><a href="#"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z"/></svg></a> </li>
            <li><a href="index.html">Home</a></li>
            <li><a href="explore.html">Explore</a></li>
            <li><a href="route.html">Route</a></li>
        </ul>
        <ul class="navbar">
            <li><a href="index.html">Home</a></li>
            <li><a href="explore.html">Explore</a></li>
            <li><a href="route.html">Route</a></li>

            <li onclick=showSidebar()><a href="#"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M120-240v-80h720v80H120Zm0-200v-80h720v80H120Zm0-200v-80h720v80H120Z"/></svg></a></li>

        </ul>
    </nav>
    <script>
        let directionsRenderer = null;
        let directionsService = null;
        let placesData = [];


        function showSidebar(){
            const sidebar = document.querySelector('.sidebar');
            sidebar.style.display = 'flex'
        }

        function hideSidebar(){
            const sidebar = document.querySelector('.sidebar');
            sidebar.style.display = 'none'
        }

        function loadMap()
        {
            let map = new google.maps.Map(document.getElementById("map"), {
                mapId: "MY_MAP_ID",
                zoom: 4,
                center: { lat: 40, lng: -20 }
            });

            directionsRenderer = new google.maps.DirectionsRenderer();
            directionsRenderer.setMap(map);
            directionsRenderer.setPanel(document.getElementById("directions"));

            directionsService = new google.maps.DirectionsService();

            loadPlaces();
        }

        function loadPlaces()
        {
            fetch("data/places.json")
                .then(res => res.json())
                .then(data =>
                {
                    placesData = data;
                    populateDropdowns();
                })
                .catch(err => console.error("JSON error:", err));
        }

        function populateDropdowns()
        {
            let startSelect = document.getElementById("start");
            let stopsSelect = document.getElementById("stops");
            let endSelect = document.getElementById("end");


            placesData.forEach((place, index) =>
            {
                startSelect.add(new Option(place.name, index));
                endSelect.add(new Option(place.name, index));
                stopsSelect.add(new Option(place.name, index));
            });

            placesData.forEach((place, index) =>
            {
                let option1 = new Option(place.name, index);
                let option2 = new Option(place.name, index);
                let option3 = new Option(place.name, index);

                startSelect.add(option1);
                stopsSelect.add(option2);
                endSelect.add(option3);
            });


            calculateRoute();
        }

        function calculateRoute()
        {
            let startIndex = document.getElementById("start").value;
            let stopsIndex = document.getElementById("stops").value;
            let endIndex = document.getElementById("end").value;

            let startPlace = placesData[startIndex];
            let stopsPlace = placesData[stopsIndex];
            let endPlace = placesData[endIndex];


            let stopsSelect = document.getElementById("stops");
            let waypoints = [];

            for (let i = 0; i < stopsSelect.selectedOptions.length; i++)
            {
                let stopIndex = stopsSelect.selectedOptions[i].value;
                let stopPlace = placesData[stopIndex];

                waypoints.push({
                    location: { lat: stopPlace.lat, lng: stopPlace.lng },
                    stopover: true
                });
            }

            let request = {
                origin: { lat: startPlace.lat, lng: startPlace.lng },
                destination: { lat: endPlace.lat, lng: endPlace.lng },
                waypoints: waypoints,
                optimizeWaypoints: true,
                travelMode: google.maps.TravelMode.DRIVING
            };

            directionsService.route(request, (result, status) =>
            {
                if (status === "OK")
                {
                    directionsRenderer.setDirections(result);
                }
            });
        }
    </script>
</head>

<body>

<div id="control-panel">
    <span class="select-location-label">Start:</span>
    <select id="start" onchange="calculateRoute()"></select>

    <br>

    <span class="select-location-label">End:</span>
    <select id="end" onchange="calculateRoute()"></select>

    <span class="select-location-label">Stops:</span>
    <select id="stops" multiple onchange="calculateRoute()" style="height:100px;"></select>
</div>

<div id="directions"></div>
<div id="map"></div>

<!-- Google Maps -->
<script async
        src="https://maps.googleapis.com/maps/api/js?key=AIzaSyA40KRYT_gpPJzbN_ta-pdESQwsyVkhgn4&loading=async&callback=loadMap">
</script>

</body>
</html>
