<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore - World Cup Travel</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
        }

        /* NAVBAR */
        nav {
            background: #020617;
            padding: 10px 20px;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            list-style: none;
            padding: 0;
        }

        .navbar li a {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        /* FILTER */
        .filterBar {
            padding: 20px;
            text-align: center;
        }

        .filterBar button {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            background: #2563eb;
            color: white;
            cursor: pointer;
        }

        .filterBar button:hover {
            background: #1d4ed8;
        }

        /* GRID */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }

        /* CARD */
        .card {
            background: #020617;
            border-radius: 12px;
            overflow: hidden;
            transition: 0.3s;
        }

        .card:hover {
            transform: scale(1.03);
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
        }

        .cardContent {
            padding: 15px;
        }

        .cardContent h3 {
            margin: 0;
        }

        .typeTag {
            font-size: 12px;
            background: #2563eb;
            padding: 4px 8px;
            border-radius: 6px;
            display: inline-block;
            margin-bottom: 5px;
        }

        /* MOBILE */
        @media(max-width:600px){
            .navbar {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>

    <script>
        let placesData = [];

        function loadPlaces()
        {
            fetch("data/places.json")
                .then(res => res.json())
                .then(data =>
                {
                    placesData = data;
                    displayPlaces(data);
                })
                .catch(err => console.error(err));
        }

        function displayPlaces(data)
        {
            let container = document.getElementById("grid");
            container.innerHTML = "";

            data.forEach(place =>
            {
                let card = `
                    <div class="card">
                        <img src="${place.image}">
                        <div class="cardContent">
                            <span class="typeTag">${place.type}</span>
                            <h3>${place.name}</h3>
                            <p>${place.description}</p>
                            <small>${place.country}</small>
                        </div>
                    </div>
                `;

                container.innerHTML += card;
            });
        }

        function filterPlaces(type)
        {
            if(type === "all")
            {
                displayPlaces(placesData);
            }
            else
            {
                let filtered = placesData.filter(p => p.type === type);
                displayPlaces(filtered);
            }
        }

        window.onload = loadPlaces;
    </script>
</head>

<body>

<!-- NAV -->
<nav>
    <ul class="navbar">
        <li><a href="index.html">Home</a></li>
        <li><a href="explore.html">Explore</a></li>
        <li><a href="route.html">Route</a></li>
    </ul>
</nav>


<div class="filter">
    <button onclick="filterPlaces('all')">All</button>
    <button onclick="filterPlaces('stadium')">Stadiums</button>
    <button onclick="filterPlaces('restaurant')">Restaurants</button>
    <button onclick="filterPlaces('hotel')">Hotels</button>
    <button onclick="filterPlaces('attraction')">Attractions</button>
</div>


<div id="grid" class="grid"></div>

</body>
</html>
